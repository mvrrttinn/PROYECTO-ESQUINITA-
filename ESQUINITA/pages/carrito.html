<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tu carrito de compras - La Esquinita, Comida Rápida al Paso en Renca.">
    <title>Carrito | La Esquinita - Comida Rápida al Paso</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!--Carrito Css-->
    <link rel="stylesheet" href="../css/pago.css">
</head>
<body>

    <!-- NAVBAR -->
    <div id="nav-placeholder"></div>

    <!-- ========== HERO CARRITO ========== -->
    <section class="menu-hero">
        <div class="container text-center">
            <span class="section-badge section-badge-dark"><i class="bi bi-cart3"></i> Tu Pedido</span>
            <h1 class="hero-title">Tu <span class="text-primary-custom">Carrito</span></h1>
            <p class="hero-description mx-auto text-center" style="color: rgba(255,255,255,0.8);">
                Revisa tu pedido, ajusta las cantidades y envíalo directo por WhatsApp 📱
            </p>
        </div>
    </section>

    <!-- ========== CONTENIDO DEL CARRITO ========== -->
    <main class="section-padding bg-light-custom" style="padding-top: 40px;">
        <div class="container">
            <div class="row g-4">
                <!-- Columna izquierda: Lista de productos -->
                <div class="col-lg-8">
                    <div id="cart-container">
                        <!-- Renderizado dinámicamente por carrito.js -->
                    </div>
                </div>

                <!-- Columna derecha: Resumen -->
                <div class="col-lg-4">
                    <div id="cart-summary" style="position: sticky; top: 100px;">
                        <!-- Renderizado dinámicamente por carrito.js -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- BOTÓN FLOTANTE WHATSAPP -->
    <a href="https://wa.me/56982362728?text=¡Hola!%20Quiero%20hacer%20un%20pedido%20🍔" 
       class="whatsapp-float" target="_blank" title="¡Pide por WhatsApp!">
        <i class="bi bi-whatsapp"></i>
    </a>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/whatsapp.js"></script>

    <script>
        // Renderizar carrito al cargar la página
        document.addEventListener('DOMContentLoaded', async function() {
            if (typeof cargarConfiguracionDelivery === 'function') {
                await cargarConfiguracionDelivery();
            }
            renderizarCarrito();
        });
    </script>

</body>
</html>
