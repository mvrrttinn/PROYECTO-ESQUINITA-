<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Nuevo Pedido | La Esquinita</title></head>
<body class="admin-body">

 <div class="sidebar-brand"><span style="font-size:1.5rem">&#x1F32D;</span><h4 style="font-family:'Bangers',cursive;font-size:1.3rem;margin:6px 0 0;letter-spacing:1px">La <span style="color:#FFB800">Esquinita</span></h4></div>
 <nav class="sidebar-nav">
  <div class="sidebar-section">GESTI&Oacute;N</div>
  <a href="dashboard.html" data-p="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="nuevo-pedido.html" data-p="nuevo-pedido"><i class="bi bi-plus-circle"></i> Nuevo Pedido</a>
  <a href="pedidos.html" data-p="pedidos"><i class="bi bi-bag"></i> Pedidos <span class="nav-badge" id="bPend" style="display:none">0</span></a>
  <div class="sidebar-section">INVENTARIO</div>
  <a href="ingredientes.html" data-p="ingredientes"><i class="bi bi-box-seam"></i> Ingredientes</a>

 </nav>
</aside>
<main class="admin-main">
<div class="admin-topbar">
 <h5><i class="bi bi-plus-circle" style="color:#FFB800"></i> Nuevo Pedido</h5>
 <div class="topbar-right"><span id="aN">Admin</span> <span class="badge bg-warning text-dark" id="aR">admin</span> <span class="text-muted ms-2" id="aF"></span></div>
</div>
<div class="admin-content"><div class="row g-4">
 <div class="col-lg-8"><div class="ac"><h6><i class="bi bi-grid" style="color:#FFB800"></i> Productos</h6><div class="cat-filters" id="cf"></div><div class="product-grid" id="pg"><div class="text-center text-muted py-4">Cargando...</div></div></div></div>
 <div class="col-lg-4"><div class="ac order-summary"><h6><i class="bi bi-receipt" style="color:#FFB800"></i> Resumen</h6>
  <div id="oi"><div class="oe"><i class="bi bi-cart3"></i>Agrega productos</div></div><hr>
  <div class="d-flex justify-content-between align-items-center mb-3"><span class="fw-bold">TOTAL:</span><span class="ot" id="oT">$0</span></div>
  <h6 style="font-size:.85rem" class="mb-2"><i class="bi bi-credit-card" style="color:#FFB800"></i> Pago</h6>
  <div class="pago-btns mb-3"><div class="pb" onclick="sp('efectivo')" id="pe"><span class="pi">💵</span>Efectivo</div><div class="pb" onclick="sp('debito')" id="pd"><span class="pi">💳</span>D&eacute;bito</div><div class="pb" onclick="sp('transferencia')" id="pt"><span class="pi">🏦</span>Transfer.</div></div>
  <div class="mb-2"><input class="form-control form-control-sm" id="cn" placeholder="Nombre (opcional)"></div>
  <div class="mb-2"><input class="form-control form-control-sm" id="ct" placeholder="Tel&eacute;fono (opcional)"></div>
  <div class="mb-3"><input class="form-control form-control-sm" id="cd" placeholder="Direcci&oacute;n (opcional)"></div>
  <button class="btn-crear mb-2" id="bc" onclick="crearP()" disabled><i class="bi bi-check-circle"></i> Crear Pedido</button>
  <button class="btn btn-outline-danger w-100" onclick="limpiar()"><i class="bi bi-trash3"></i> Limpiar</button>
 </div></div>
</div></div></main>
<script>
const API = (window.location.protocol.startsWith('http') ? window.location.origin : 'http://localhost:4000') + '/api';
const TK = localStorage.getItem('le_token');
const AD = JSON.parse(localStorage.getItem('le_admin')||'{}');
if(!TK)location.href='login.html';
function fp(n){return '$'+n.toLocaleString('es-CL')}
function fh(d){return new Date(d).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}
function fd(d){return new Date(d).toLocaleDateString('es-CL')}
async function af(u,o={}){const r=await fetch(API+u,{headers:{'Authorization':'Bearer '+TK,'Content-Type':'application/json'},...o});if(r.status===401){localStorage.clear();location.href='login.html';return null}return r.json()}
function logout(){localStorage.removeItem('le_token');localStorage.removeItem('le_admin');location.href='login.html'}
function toggleSB(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('active')}
document.addEventListener('DOMContentLoaded',()=>{
 const n=document.getElementById('aN');if(n)n.textContent=AD.nombre||'Admin';
 const r=document.getElementById('aR');if(r)r.textContent=AD.rol||'admin';
 const f=document.getElementById('aF');if(f)f.textContent=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
 document.querySelectorAll('[data-p]').forEach(a=>a.classList.toggle('active',a.dataset.p===PAGE));
 if(typeof init==='function')init();
});
const eL={pendiente:'\u23f3 Pendiente',confirmado:'\u2705 Confirmado',preparando:'\uD83D\uDD25 Preparando',en_camino:'\uD83D\uDEF5 En Camino',entregado:'\uD83D\uDCE6 Entregado',cancelado:'\u274c Cancelado'};
const eC={pendiente:'badge-pendiente',confirmado:'badge-confirmado',preparando:'badge-preparando',en_camino:'badge-en_camino',entregado:'badge-entregado',cancelado:'badge-cancelado'};
const eF=['pendiente','confirmado','preparando','en_camino','entregado'];
</script>
<script>
const PAGE='nuevo-pedido';let prods=[],orden=[],pago=null,catF='Todas';
async function init(){const d=await af('/productos');if(!d)return;prods=d.productos||d||[];const cats=[...new Set(prods.map(p=>p.categoria))];document.getElementById('cf').innerHTML='<button class="cat-btn active" onclick="fil(this,\'Todas\')">Todas</button>'+cats.map(c=>'<button class="cat-btn" onclick="fil(this,\''+c+'\')">'+c+'</button>').join('');rP()}
function fil(el,c){catF=c;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');rP()}
function rP(){const g=document.getElementById('pg');const l=catF==='Todas'?prods:prods.filter(p=>p.categoria===catF);if(!l.length){g.innerHTML='<div class="text-center text-muted py-4">Sin productos</div>';return}g.innerHTML=l.map(p=>'<div class="product-card"><div class="p-name">'+p.nombre+'</div><div class="p-cat">'+p.categoria+'</div><div class="p-price">'+fp(p.precio)+'</div><div class="p-act"><input type="number" value="1" min="1" max="20" id="q-'+p._id+'"><button class="btn-ag" onclick="addI(\''+p._id+'\')"><i class="bi bi-plus"></i> Agregar</button></div></div>').join('')}
function addI(id){const p=prods.find(x=>x._id===id);if(!p)return;const q=parseInt(document.getElementById('q-'+id)?.value)||1;const e=orden.findIndex(o=>o.nombre===p.nombre);if(e>-1)orden[e].cantidad+=q;else orden.push({nombre:p.nombre,precio:p.precio,cantidad:q,categoria:p.categoria});rO()}
function qO(i,d){orden[i].cantidad+=d;if(orden[i].cantidad<=0)orden.splice(i,1);rO()}
function rO(){const div=document.getElementById('oi'),btn=document.getElementById('bc');if(!orden.length){div.innerHTML='<div class="oe"><i class="bi bi-cart3"></i>Agrega productos</div>';document.getElementById('oT').textContent='$0';btn.disabled=true;return}let t=0;div.innerHTML=orden.map((it,i)=>{const s=it.precio*it.cantidad;t+=s;return '<div class="oi"><div class="on">'+it.nombre+'<br><small class="text-muted">'+fp(it.precio)+' c/u</small></div><div class="oq"><button onclick="qO('+i+',-1)"><i class="bi bi-dash"></i></button><span>'+it.cantidad+'</span><button onclick="qO('+i+',1)"><i class="bi bi-plus"></i></button></div><div class="os">'+fp(s)+'</div></div>'}).join('');document.getElementById('oT').textContent=fp(t);btn.disabled=!pago}
function sp(m){pago=m;document.querySelectorAll('.pb').forEach(b=>b.classList.remove('sel'));document.getElementById(m==='efectivo'?'pe':m==='debito'?'pd':'pt').classList.add('sel');document.getElementById('bc').disabled=!orden.length}
async function crearP(){if(!orden.length||!pago)return;const total=orden.reduce((s,i)=>s+i.precio*i.cantidad,0);const btn=document.getElementById('bc');btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm"></span>';
try{const r=await af('/pedidos',{method:'POST',body:JSON.stringify({productos:orden,total,metodoPago:pago,cliente:{nombre:document.getElementById('cn').value,telefono:document.getElementById('ct').value,direccion:document.getElementById('cd').value},delivery:!!document.getElementById('cd').value})});if(r&&!r.error){alert('✅ Pedido creado: '+(r.pedido?.numeroPedido||r.numeroPedido||'OK'));limpiar()}else alert('❌ '+(r?.error||'Error'))}catch(e){alert('❌ '+e.message)}finally{btn.disabled=false;btn.innerHTML='<i class="bi bi-check-circle"></i> Crear Pedido'}}
function limpiar(){orden=[];pago=null;document.querySelectorAll('.pb').forEach(b=>b.classList.remove('sel'));['cn','ct','cd'].forEach(id=>document.getElementById(id).value='');rO()}
</script></body></html>
