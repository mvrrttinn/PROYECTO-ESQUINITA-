<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/admin.css">
<title>Admin | La Esquinita</title></head>
<body class="admin-login">
<div class="login-card">
 <div class="login-brand"><span class="emoji">&#x1F32D;</span><h1>La <span>Esquinita</span></h1><p>Panel de Administraci&oacute;n</p></div>
 <div class="login-error" id="err"></div>
 <form onsubmit="doLogin(event)">
  <div class="mb-3"><label class="form-label fw-semibold">Email</label><div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input type="email" class="form-control" id="em" placeholder="admin@esquinita.cl" required></div></div>
  <div class="mb-4"><label class="form-label fw-semibold">Contrase&ntilde;a</label><div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span><input type="password" class="form-control" id="pw" required></div></div>
  <button type="submit" class="btn btn-login" id="btn"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesi&oacute;n</button>
 </form>
 <div class="text-center mt-3"><a href="../../index.html" class="text-muted" style="font-size:.85rem"><i class="bi bi-arrow-left"></i> Volver al sitio</a></div>
</div>
<script>
const API = (window.location.protocol.startsWith('http') ? window.location.origin : 'http://localhost:4000') + '/api';
if(localStorage.getItem('le_token'))location.href='dashboard.html';
async function doLogin(e){e.preventDefault();const b=document.getElementById('btn'),er=document.getElementById('err');b.disabled=true;b.innerHTML='<span class="spinner-border spinner-border-sm"></span>';er.style.display='none';
try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('em').value,password:document.getElementById('pw').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');localStorage.setItem('le_token',d.token);localStorage.setItem('le_admin',JSON.stringify(d.admin));location.href='dashboard.html';}catch(x){er.textContent=x.message;er.style.display='block';}finally{b.disabled=false;b.innerHTML='<i class="bi bi-box-arrow-in-right"></i> Iniciar Sesi&oacute;n';}}
</script></body></html>
