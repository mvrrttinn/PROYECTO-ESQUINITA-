<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Productos | La Esquinita</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
<aside class="admin-sidebar" id="sidebar">
 <div class="sidebar-brand"><span>🌭</span> La Esquinita <span class="badge bg-warning text-dark ms-1" style="font-size:.6rem">Admin</span></div>
 <nav class="sidebar-nav">
  <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="nuevo-pedido.html"><i class="bi bi-plus-circle"></i> Nuevo Pedido</a>
  <hr>
  <a href="productos.html" class="solo-admin active"><i class="bi bi-box-seam"></i> Productos</a>
  <a href="ingredientes.html" class="solo-admin"><i class="bi bi-basket"></i> Ingredientes</a>
  <hr class="solo-admin">
  <a href="usuarios.html" class="solo-admin"><i class="bi bi-people"></i> Usuarios</a>
  <hr>
  <a href="../../index.html"><i class="bi bi-globe"></i> Ir al Sitio</a>
  <a href="#" onclick="cerrarSesion()" class="text-danger"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
 </nav>
</aside>
<main class="admin-main">
 <div class="admin-topbar">
  <h5><i class="bi bi-box-seam"></i> Gestión de Productos</h5>
  <div class="topbar-right">
   <span id="adminNombre">Admin</span>
   <span class="badge bg-warning text-dark" id="adminRol">admin</span>
   <span class="text-muted ms-2" id="fechaHoy"></span>
  </div>
 </div>
 <div class="admin-content">
  <div class="row g-3 mb-4">
   <div class="col-sm-4"><div class="stat-card stat-blue"><div class="stat-icon"><i class="bi bi-box-seam"></i></div><div class="stat-info"><h6>Total Productos</h6><h3 id="sTotal">0</h3></div></div></div>
   <div class="col-sm-4"><div class="stat-card stat-green"><div class="stat-icon"><i class="bi bi-check-circle"></i></div><div class="stat-info"><h6>Disponibles</h6><h3 id="sDisp">0</h3></div></div></div>
   <div class="col-sm-4"><div class="stat-card stat-red"><div class="stat-icon"><i class="bi bi-x-circle"></i></div><div class="stat-info"><h6>No Disponibles</h6><h3 id="sNoDisp">0</h3></div></div></div>
  </div>
  <div class="admin-card">
   <div class="d-flex justify-content-between align-items-center mb-3">
    <h6 class="mb-0"><i class="bi bi-list-ul"></i> Listado de Productos</h6>
    <button class="btn btn-sm text-dark fw-bold" style="background:#FFB800;border-radius:10px" onclick="abrirModal()"><i class="bi bi-plus-lg"></i> Agregar Producto</button>
   </div>
   <div class="table-responsive">
    <table class="table table-sm table-hover mb-0">
     <thead><tr><th>#</th><th>Nombre</th><th>Categoría</th><th class="text-end">Precio</th><th class="text-center">Disponible</th><th>Acciones</th></tr></thead>
     <tbody id="tbProductos"><tr><td colspan="6" class="text-center text-muted">Cargando...</td></tr></tbody>
    </table>
   </div>
  </div>
 </div>
</main>
<div class="modal fade" id="modalProducto" tabindex="-1">
 <div class="modal-dialog">
  <div class="modal-content" style="border-radius:16px">
   <div class="modal-header" style="border-bottom:2px solid #FFB800">
    <h5 class="modal-title fw-bold" id="modalTitulo"><i class="bi bi-box-seam"></i> Agregar Producto</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
   </div>
   <div class="modal-body">
    <input type="hidden" id="prodId">
    <div class="mb-3"><label class="form-label fw-semibold">Nombre *</label><input type="text" class="form-control" id="prodNombre" required style="border-radius:10px;border:2px solid #e0e0e0"></div>
    <div class="mb-3"><label class="form-label fw-semibold">Descripción</label><textarea class="form-control" id="prodDesc" rows="2" style="border-radius:10px;border:2px solid #e0e0e0"></textarea></div>
    <div class="row g-3 mb-3">
     <div class="col-6"><label class="form-label fw-semibold">Precio *</label><input type="number" class="form-control" id="prodPrecio" min="0" required style="border-radius:10px;border:2px solid #e0e0e0"></div>
     <div class="col-6"><label class="form-label fw-semibold">Categoría</label><select class="form-select" id="prodCat" style="border-radius:10px;border:2px solid #e0e0e0"><option value="churrascos">Churrascos</option><option value="completos">Completos</option><option value="papas_fritas">Papas Fritas</option><option value="bebidas">Bebidas</option><option value="extras">Extras</option></select></div>
    </div>
    <div class="mb-3"><label class="form-label fw-semibold">Imagen (URL)</label><input type="text" class="form-control" id="prodImg" placeholder="https://..." style="border-radius:10px;border:2px solid #e0e0e0"></div>
    <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="prodDisp" checked><label class="form-check-label fw-semibold" for="prodDisp">Disponible</label></div>
   </div>
   <div class="modal-footer">
    <button class="btn btn-secondary" data-bs-dismiss="modal" style="border-radius:10px">Cancelar</button>
    <button class="btn text-dark fw-bold" style="background:#FFB800;border-radius:10px" onclick="guardarProducto()" id="btnGuardar"><i class="bi bi-check-lg"></i> Guardar</button>
   </div>
  </div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = (window.location.protocol.startsWith('http') ? window.location.origin : 'http://localhost:4000') + '/api';
const TOKEN=localStorage.getItem('le_token');
const ADMIN=JSON.parse(localStorage.getItem('le_admin')||'{}');
if(!TOKEN) window.location.href='login.html';
if(ADMIN.rol!=='admin'){alert('Acceso solo para administradores');window.location.href='dashboard.html';}
let productos=[], modal=null;
function fp(n){return '$'+n.toLocaleString('es-CL');}
document.addEventListener('DOMContentLoaded',()=>{
 document.getElementById('adminNombre').textContent=ADMIN.nombre||'Admin';
 document.getElementById('adminRol').textContent=ADMIN.rol||'admin';
 document.getElementById('fechaHoy').textContent=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
 if(ADMIN.rol==='cajero'){document.querySelectorAll('.solo-admin').forEach(el=>el.style.display='none');}
 modal=new bootstrap.Modal(document.getElementById('modalProducto'));
 cargar();
});
async function apiFetch(url,opts={}){
 const r=await fetch(API+url,{headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},...opts});
 if(r.status===401){localStorage.clear();window.location.href='login.html';return null;}
 if(r.status===204) return {};
 return r.json();
}
async function cargar(){
 const data=await apiFetch('/productos');
 if(!data)return;
 productos=Array.isArray(data)?data:[];
 document.getElementById('sTotal').textContent=productos.length;
 document.getElementById('sDisp').textContent=productos.filter(p=>p.disponible!==false).length;
 document.getElementById('sNoDisp').textContent=productos.filter(p=>p.disponible===false).length;
 const tb=document.getElementById('tbProductos');
 if(!productos.length){tb.innerHTML='<tr><td colspan="6" class="text-center text-muted">No hay productos</td></tr>';return;}
 tb.innerHTML=productos.map((p,i)=>{
  const catLabel=(p.categoria||'').charAt(0).toUpperCase()+(p.categoria||'').slice(1).replace(/_/g,' ');
  const disp=p.disponible!==false;
  return `<tr>
   <td>${i+1}</td>
   <td><strong>${p.nombre}</strong>${p.descripcion?'<br><small class="text-muted">'+p.descripcion+'</small>':''}</td>
   <td>${catLabel}</td>
   <td class="text-end fw-bold">${fp(p.precio)}</td>
   <td class="text-center"><span class="badge ${disp?'bg-success':'bg-danger'}">${disp?'Sí':'No'}</span></td>
   <td>
    <div class="btn-group btn-group-sm">
     <button class="btn btn-outline-primary btn-sm" onclick="editarProducto('${p._id}')" title="Editar"><i class="bi bi-pencil"></i></button>
     <button class="btn btn-outline-${disp?'warning':'success'} btn-sm" onclick="toggleDisp('${p._id}',${!disp})" title="${disp?'Deshabilitar':'Habilitar'}"><i class="bi bi-${disp?'eye-slash':'eye'}"></i></button>
     <button class="btn btn-outline-danger btn-sm" onclick="eliminarProducto('${p._id}','${p.nombre.replace("'","\\'")}')" title="Eliminar"><i class="bi bi-trash3"></i></button>
    </div>
   </td></tr>`;
 }).join('');
}
function abrirModal(){
 document.getElementById('modalTitulo').innerHTML='<i class="bi bi-box-seam"></i> Agregar Producto';
 document.getElementById('prodId').value='';
 document.getElementById('prodNombre').value='';
 document.getElementById('prodDesc').value='';
 document.getElementById('prodPrecio').value='';
 document.getElementById('prodCat').value='churrascos';
 document.getElementById('prodImg').value='';
 document.getElementById('prodDisp').checked=true;
 modal.show();
}
function editarProducto(id){
 const p=productos.find(x=>x._id===id);if(!p)return;
 document.getElementById('modalTitulo').innerHTML='<i class="bi bi-pencil"></i> Editar Producto';
 document.getElementById('prodId').value=p._id;
 document.getElementById('prodNombre').value=p.nombre;
 document.getElementById('prodDesc').value=p.descripcion||'';
 document.getElementById('prodPrecio').value=p.precio;
 document.getElementById('prodCat').value=p.categoria||'churrascos';
 document.getElementById('prodImg').value=p.imagen||'';
 document.getElementById('prodDisp').checked=p.disponible!==false;
 modal.show();
}
async function guardarProducto(){
 const id=document.getElementById('prodId').value;
 const nombre=document.getElementById('prodNombre').value.trim();
 const precio=parseInt(document.getElementById('prodPrecio').value);
 if(!nombre||isNaN(precio)){alert('Nombre y precio son obligatorios');return;}
 const body={nombre,descripcion:document.getElementById('prodDesc').value.trim(),precio,categoria:document.getElementById('prodCat').value,imagen:document.getElementById('prodImg').value.trim(),disponible:document.getElementById('prodDisp').checked};
 const btn=document.getElementById('btnGuardar');
 btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm"></span>';
 try{
  if(id){await apiFetch('/productos/'+id,{method:'PUT',body:JSON.stringify(body)});}
  else{await apiFetch('/productos',{method:'POST',body:JSON.stringify(body)});}
  modal.hide();cargar();
 }catch(e){alert('Error: '+e.message);}
 finally{btn.disabled=false;btn.innerHTML='<i class="bi bi-check-lg"></i> Guardar';}
}
async function toggleDisp(id,val){await apiFetch('/productos/'+id,{method:'PATCH',body:JSON.stringify({disponible:val})});cargar();}
async function eliminarProducto(id,nombre){if(!confirm('¿Eliminar "'+nombre+'"?'))return;await apiFetch('/productos/'+id,{method:'DELETE'});cargar();}
function cerrarSesion(){localStorage.removeItem('le_token');localStorage.removeItem('le_admin');window.location.href='login.html';}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('active');}
</script>
</body></html>
