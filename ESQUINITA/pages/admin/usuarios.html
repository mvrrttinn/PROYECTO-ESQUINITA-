 <nav class="sidebar-nav">

 </nav>

<main class="admin-main">
<div class="admin-topbar">
 <h5><i class="bi bi-people" style="color:#FFB800"></i> Usuarios</h5>
 <div class="topbar-right"><span id="aN">Admin</span> <span class="badge bg-warning text-dark" id="aR">admin</span> <span class="text-muted ms-2" id="aF"></span></div>
</div>
<div class="admin-content">
 <div class="ac"><div class="d-flex justify-content-between align-items-center mb-3"><h6 class="mb-0"><i class="bi bi-people" style="color:#FFB800"></i> Equipo</h6><button class="btn btn-sm btn-warning" onclick="document.getElementById('fNew').style.display='block'" id="btnNew"><i class="bi bi-plus"></i> Nuevo Usuario</button></div>
 <div id="fNew" style="display:none" class="p-3 mb-3 bg-light rounded"><h6>Crear Usuario</h6>
  <div class="row g-2"><div class="col-md-3"><input class="form-control form-control-sm" id="nNom" placeholder="Nombre"></div><div class="col-md-3"><input class="form-control form-control-sm" id="nEm" placeholder="Email" type="email"></div><div class="col-md-2"><input class="form-control form-control-sm" id="nPw" placeholder="Contrase&ntilde;a" type="password"></div><div class="col-md-2"><select class="form-select form-select-sm" id="nRol"><option value="cajero">Cajero</option><option value="admin">Admin</option></select></div><div class="col-md-2"><button class="btn btn-success btn-sm w-100" onclick="crearU()"><i class="bi bi-check"></i> Crear</button></div></div></div>
 <div class="table-responsive"><table class="table table-sm table-hover mb-0"><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Creado</th></tr></thead><tbody id="tU">...</tbody></table></div></div>
</div></main>
<script>
const API = (window.location.protocol.startsWith('http') ? window.location.origin : 'http://localhost:4000') + '/api';
const TK = localStorage.getItem('le_token');
const AD = JSON.parse(localStorage.getItem('le_admin')||'{}');
if(!TK)location.href='login.html';
function fp(n){return '$'+n.toLocaleString('es-CL')}
function fh(d){return new Date(d).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}
function fd(d){return new Date(d).toLocaleDateString('es-CL')}
async function af(u,o={}){const r=await fetch(API+u,{headers:{'Authorization':'Bearer '+TK,'Content-Type':'application/json'},...o});if(r.status===401){localStorage.clear();location.href='login.html';return null}return r.json()}
function logout(){localStorage.removeItem('le_token');localStorage.removeItem('le_admin');location.href='login.html'}
function toggleSB(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('active')}
document.addEventListener('DOMContentLoaded',()=>{
 const n=document.getElementById('aN');if(n)n.textContent=AD.nombre||'Admin';
 const r=document.getElementById('aR');if(r)r.textContent=AD.rol||'admin';
 const f=document.getElementById('aF');if(f)f.textContent=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
 document.querySelectorAll('[data-p]').forEach(a=>a.classList.toggle('active',a.dataset.p===PAGE));
 if(typeof init==='function')init();
});
const eL={pendiente:'\u23f3 Pendiente',confirmado:'\u2705 Confirmado',preparando:'\uD83D\uDD25 Preparando',en_camino:'\uD83D\uDEF5 En Camino',entregado:'\uD83D\uDCE6 Entregado',cancelado:'\u274c Cancelado'};
const eC={pendiente:'badge-pendiente',confirmado:'badge-confirmado',preparando:'badge-preparando',en_camino:'badge-en_camino',entregado:'badge-entregado',cancelado:'badge-cancelado'};
const eF=['pendiente','confirmado','preparando','en_camino','entregado'];
</script>
<script>
const PAGE='usuarios';
async function init(){load()}
async function load(){const d=await af('/admin/usuarios');if(!d)return;const u=d.usuarios||[];
 document.getElementById('tU').innerHTML=u.length?u.map(x=>'<tr><td><strong>'+x.nombre+'</strong></td><td>'+x.email+'</td><td>'+(x.rol==='admin'?'<span class="badge bg-warning text-dark">👑 Admin</span>':'<span class="badge bg-info text-dark">💼 Cajero</span>')+'</td><td>'+(x.activo?'<span class="badge bg-success">Activo</span>':'<span class="badge bg-danger">Inactivo</span>')+'</td><td>'+fd(x.createdAt)+'</td></tr>').join(''):'<tr><td colspan="5" class="text-center text-muted">Sin usuarios</td></tr>';
}
async function crearU(){const nom=document.getElementById('nNom').value,em=document.getElementById('nEm').value,pw=document.getElementById('nPw').value,rol=document.getElementById('nRol').value;
 if(!nom||!em||!pw)return alert('Completa todos los campos');
 const r=await af('/auth/registro',{method:'POST',body:JSON.stringify({nombre:nom,email:em,password:pw,rol})});
 if(r&&!r.error){alert('✅ '+r.mensaje);document.getElementById('fNew').style.display='none';['nNom','nEm','nPw'].forEach(id=>document.getElementById(id).value='');load()}else alert('❌ '+(r?.error||'Error'))}
</script></body></html>
