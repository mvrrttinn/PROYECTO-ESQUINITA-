<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/admin.css">
<title>Pedidos | La Esquinita</title></head>
<body class="admin-body">
<div class="sidebar-overlay" id="overlay" onclick="toggleSB()"></div>
<button class="sidebar-toggle" onclick="toggleSB()"><i class="bi bi-list"></i></button>
<aside class="admin-sidebar" id="sidebar">
 <div class="sidebar-brand"><span style="font-size:1.5rem">&#x1F32D;</span><h4 style="font-family:'Bangers',cursive;font-size:1.3rem;margin:6px 0 0;letter-spacing:1px">La <span style="color:#FFB800">Esquinita</span></h4></div>
 <nav class="sidebar-nav">
  <div class="sidebar-section">GESTI&Oacute;N</div>
  <a href="dashboard.html" data-p="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="nuevo-pedido.html" data-p="nuevo-pedido"><i class="bi bi-plus-circle"></i> Nuevo Pedido</a>
  <a href="pedidos.html" data-p="pedidos"><i class="bi bi-bag"></i> Pedidos <span class="nav-badge" id="bPend" style="display:none">0</span></a>
  <div class="sidebar-section">INVENTARIO</div>
  <a href="ingredientes.html" data-p="ingredientes"><i class="bi bi-box-seam"></i> Ingredientes</a>
  <div class="sidebar-section">EQUIPO</div>
  <a href="usuarios.html" data-p="usuarios"><i class="bi bi-people"></i> Usuarios</a>
  <hr>
  <a href="../../index.html"><i class="bi bi-globe"></i> Ir al Sitio</a>
  <a href="#" onclick="logout()" class="text-danger"><i class="bi bi-box-arrow-left"></i> Cerrar Sesi&oacute;n</a>
 </nav>
</aside>
<main class="admin-main">
<div class="admin-topbar">
 <h5><i class="bi bi-bag" style="color:#FFB800"></i> Pedidos</h5>
 <div class="topbar-right"><span id="aN">Admin</span> <span class="badge bg-warning text-dark" id="aR">admin</span> <span class="text-muted ms-2" id="aF"></span></div>
</div>
<div class="admin-content">
 <div class="cat-filters mb-3" id="filtros"></div>
 <div class="ac"><h6><i class="bi bi-list-ul" style="color:#FFB800"></i> Todos los Pedidos</h6>
 <div class="table-responsive"><table class="table table-sm table-hover mb-0"><thead><tr><th>#</th><th>Fecha</th><th>Hora</th><th>Items</th><th class="text-end">Total</th><th>Pago</th><th>Estado</th><th>Acci&oacute;n</th></tr></thead><tbody id="tP">...</tbody></table></div></div>
</div></main>
<script>
const API = (window.location.protocol.startsWith('http') ? window.location.origin : 'http://localhost:4000') + '/api';
const TK = localStorage.getItem('le_token');
const AD = JSON.parse(localStorage.getItem('le_admin')||'{}');
if(!TK)location.href='login.html';
function fp(n){return '$'+n.toLocaleString('es-CL')}
function fh(d){return new Date(d).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}
function fd(d){return new Date(d).toLocaleDateString('es-CL')}
async function af(u,o={}){const r=await fetch(API+u,{headers:{'Authorization':'Bearer '+TK,'Content-Type':'application/json'},...o});if(r.status===401){localStorage.clear();location.href='login.html';return null}return r.json()}
function logout(){localStorage.removeItem('le_token');localStorage.removeItem('le_admin');location.href='login.html'}
function toggleSB(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('active')}
document.addEventListener('DOMContentLoaded',()=>{
 const n=document.getElementById('aN');if(n)n.textContent=AD.nombre||'Admin';
 const r=document.getElementById('aR');if(r)r.textContent=AD.rol||'admin';
 const f=document.getElementById('aF');if(f)f.textContent=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
 document.querySelectorAll('[data-p]').forEach(a=>a.classList.toggle('active',a.dataset.p===PAGE));
 if(typeof init==='function')init();
});
const eL={pendiente:'\u23f3 Pendiente',confirmado:'\u2705 Confirmado',preparando:'\uD83D\uDD25 Preparando',en_camino:'\uD83D\uDEF5 En Camino',entregado:'\uD83D\uDCE6 Entregado',cancelado:'\u274c Cancelado'};
const eC={pendiente:'badge-pendiente',confirmado:'badge-confirmado',preparando:'badge-preparando',en_camino:'badge-en_camino',entregado:'badge-entregado',cancelado:'badge-cancelado'};
const eF=['pendiente','confirmado','preparando','en_camino','entregado'];
</script>
<script>
const PAGE='pedidos';let allP=[],filtro='todos';
async function init(){load()}
async function load(){const d=await af('/admin/dashboard');if(!d)return;allP=d.pedidosRecientes||[];const bp=document.getElementById('bPend');if(d.pedidosPendientes>0){bp.textContent=d.pedidosPendientes;bp.style.display='inline'}else bp.style.display='none';
 document.getElementById('filtros').innerHTML=['todos','pendiente','confirmado','preparando','en_camino','entregado','cancelado'].map(e=>'<button class="cat-btn'+(filtro===e?' active':'')+'" onclick="setF(this,\''+e+'\')">'+( e==='todos'?'Todos':eL[e]||e)+'</button>').join('');render()}
function setF(el,f){filtro=f;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function render(){const list=filtro==='todos'?allP:allP.filter(p=>p.estado===filtro);const tb=document.getElementById('tP');if(!list.length){tb.innerHTML='<tr><td colspan="8" class="text-center text-muted">Sin pedidos</td></tr>';return}
 tb.innerHTML=list.map(p=>{const it=p.productos.map(x=>x.cantidad+'x '+x.nombre).join(', ');const i=eF.indexOf(p.estado),s=i>=0&&i<eF.length-1?eF[i+1]:null;let a='—';if(p.estado!=='entregado'&&p.estado!=='cancelado'){a='<div class="btn-group btn-group-sm">';if(s)a+='<button class="btn btn-outline-success btn-sm" onclick="ce(\''+p._id+'\',\''+s+'\')">'+eL[s]+'</button>';a+='<button class="btn btn-outline-danger btn-sm" onclick="ce(\''+p._id+'\',\'cancelado\')">❌</button></div>'}return '<tr><td><code>'+(p.numeroPedido||'—')+'</code></td><td>'+fd(p.createdAt)+'</td><td>'+fh(p.createdAt)+'</td><td><small>'+(it.length>40?it.substring(0,40)+'...':it)+'</small></td><td class="text-end fw-bold">'+fp(p.total)+'</td><td>'+(p.metodoPago||'')+'</td><td><span class="badge '+(eC[p.estado]||'bg-secondary')+'">'+eL[p.estado]+'</span></td><td>'+a+'</td></tr>'}).join('')}
async function ce(id,est){await af('/admin/pedido/'+id+'/estado',{method:'PATCH',body:JSON.stringify({estado:est})});load()}
</script></body></html>
